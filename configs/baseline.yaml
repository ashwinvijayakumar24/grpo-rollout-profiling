# Baseline GRPO run that every experiment varies from. See PLAN.md and DECISIONS.md.
experiment: baseline
model: Qwen/Qwen2.5-1.5B-Instruct
dtype: bfloat16
seed: 0
data:
  split: train
  limit: null              # 1000 frozen GSM8K problems; 50 steps x 8 prompts uses 400
lora:
  enabled: false           # full fine-tune; switch on only if it does not fit next to vLLM
grpo:
  prompts_per_step: 8      # B
  num_generations: 8       # G -> 64 completions per step
  micro_batch: 8           # completions per loss forward; 64 OOMs, 16 OOMs next to vLLM (PROGRESS.md)
  max_completion_length: 256
  temperature: 1.0
  learning_rate: 1.0e-6
  max_steps: 50
  beta: 0.0
  gradient_checkpointing: false
rollout:
  backend: vllm
  gpu_memory_utilization: 0.15  # ~12 GB: weights ~3 GB + KV cache; 0.3 left no room for training
  sleep_mode: false
  sync_every: 1
timing:
  enabled: true
  record_events: true
  nvml_interval_s: 0.05
  profile_steps: null
